name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npx vitest run

      # Word banks are the part contributors touch most, and the part a
      # type error will not catch. This fails on a bad reading, an
      # unusable initial, or an entry the validator will not accept back.
      - name: Word bank integrity
        run: node scripts/check-banks.mjs

      - name: End-to-end smoke test
        run: node scripts/smoke.mjs
